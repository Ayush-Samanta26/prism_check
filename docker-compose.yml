services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://prism:prism@db:5432/prism
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
